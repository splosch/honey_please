; ════════════════════════════════════════════════════════════════════════════
;  honey_please – platformio.ini
;  Active target: Arduino Uno R4 WiFi (Phase 6)
;  ESP32 environments removed 2026-05-16 – hardware swapped.
;  Migration rationale: docs/features/F11-platform-migration-r4-wifi.md
; ════════════════════════════════════════════════════════════════════════════

[platformio]
src_dir = advanced-control

; ── Arduino Uno R4 WiFi ─────────────────────────────────────────────────────
;
;  MCU:  Renesas RA4M1 (ARM Cortex-M4 @ 48 MHz)
;        GPIO OUTPUT = 5 V  |  GPIO INPUT max = 5 V (5 V tolerant)
;
;  WiFi: ESP32-S3 co-processor (internal to the board, NOT user-wired)
;        The RA4M1 talks to the ESP32-S3 via an internal SPI bridge.
;        User code accesses WiFi through WiFiS3.h – no extra wiring needed.
;        Do NOT connect anything to the ESP32-S3 co-processor pads directly.
;
; ── ⚠️  BOARD PROTECTION – read before connecting anything ─────────────────
;
;  1. 5V pin is OUTPUT (sourced from USB VBUS via onboard polyfuse, ~500 mA).
;     NEVER feed external 5V into the 5V pin while USB is also connected –
;     that back-feeds into the USB host and can damage the host port or the
;     onboard polyfuse.
;
;  2. Motor driver logic power must come from its OWN external 5V rail,
;     NOT from the board's 5V pin. Driver logic transients easily exceed
;     the board's 500 mA USB budget and will brown-out the MCU mid-run.
;
;  3. GPIO max input = VCC (5 V). If any sensor outputs > 5 V logic
;     (some industrial Hall sensors output 12 V), add a resistor divider
;     before the pin. Never skip this – overvoltage permanently damages
;     the RA4M1 die.
;
;  4. The internal ESP32-S3 runs at 3.3 V internally. Its I/O to the RA4M1
;     is level-shifted on the R4 WiFi PCB. Leave those nets alone.
;
;  5. AREF: leave unconnected unless using analogReference(EXTERNAL).
;     Maximum allowed voltage on AREF = VCC (5 V).
;
; ── Pin assignment (placeholder – confirmed in motor_config.h at Phase 6 real-HW milestone)
;
;  Pin  9  (PWM ~)  → Motor driver PWM input       (5 V out, driver must accept 5 V)
;  Pin  7           → Motor driver DIR_A            (5 V out)
;  Pin  8           → Motor driver DIR_B            (5 V out)
;  Pin  6  (PWM ~)  → Motor driver ENABLE           (5 V out)
;  Pin  2  (INT0)   → RPM sensor pulse input        (5 V tolerant in; add pull-up if open-collector)
;  Pin A0           → nFAULT from motor driver      (active LOW; 10 kΩ pull-up to 5 V)
;  GPIO 13          → LED_BUILTIN status LED        (active HIGH, onboard)
;
; ── OTA: activate after M6.2 (WiFi verified on real R4 hardware)
;   upload_protocol = arduinoota
;   upload_port     = <R4_IP_ADDRESS>
;
; ── Build / upload commands
;   pio run -e r4wifi                               compile only
;   pio run -e r4wifi --target upload               USB flash (auto-detect port)
;   pio run -e r4wifi --target upload --upload-port COMx   explicit port

[env:r4wifi]
platform  = renesas-ra
board     = uno_r4_wifi
framework = arduino

monitor_speed = 115200
upload_speed  = 115200

; Libraries bundled with the R4 board package (no lib_deps entry needed):
;   WiFiS3, ArduinoOTA, EEPROM
;
; Libraries excluded (ESP32-only, not available on R4):
;   ESPAsyncWebServer, AsyncTCP, WebSerial, LittleFS, Preferences (NVS)

lib_deps =
    bblanchon/ArduinoJson @ ^7.3.1

; Compile-time platform guard (used in main.cpp and web_api.cpp):
;   #ifdef ARDUINO_UNOR4_WIFI
;       → WiFiS3.h, EEPROM, sync WiFiServer, USB Serial (native CDC)
;   #else
;       → ESP32 path kept in source for reference, not compiled in this env
build_flags =
    -DARDUINO_UNOR4_WIFI

; ── Board verification sketch (flash this first to confirm hardware works) ───
[env:r4wifi_verify]
platform      = renesas-ra
board         = uno_r4_wifi
framework     = arduino
build_src_filter = -<*> +<../verify_sketch/*>
monitor_speed = 115200

; ── Demo / Wiring-Verification sketch (relay + keypad test, no motor driver) ─
; Source  : docs/base_honey_extractor_controller.ino (Google Gemini baseline)
; Purpose : Verify button wiring and relay click BEFORE connecting motor driver.
; Flash   : npm run basic-control:flash   (USB auto-detected; optional: npm run basic-control:flash -- COM5)
; Monitor : pio device monitor -e r4wifi_basic_control  (115200 baud)
[env:r4wifi_basic_control]
platform         = renesas-ra
board            = uno_r4_wifi
framework        = arduino
build_src_filter = -<*> +<../basic-control/*>
monitor_speed    = 115200
