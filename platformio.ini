[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor (USB)
monitor_speed = 115200
upload_speed  = 115200

; OTA upload (Phase 3+)
upload_protocol = espota
upload_port     = 192.168.178.64  ; ESP32 IP

; LittleFS – serves index.html for the Web UI (Phase 3)
board_build.filesystem = littlefs
; Default 4 MB layout: 1 MB app, 3 MB LittleFS
board_build.partitions = min_spiffs.csv

; Dependencies
lib_deps =
    ayushsharma82/WebSerial @ ^2.1.2
    me-no-dev/ESPAsyncWebServer @ ^3.6.0
    me-no-dev/AsyncTCP @ ^1.1.1
    bblanchon/ArduinoJson @ ^7.3.1