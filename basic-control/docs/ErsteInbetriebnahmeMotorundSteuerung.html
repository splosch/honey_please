<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdrahtungsplan Honigschleuder - Erweitertes System</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Wire animation CSS (unchanged from original) -->
    <style>
        .wire {
            stroke-dasharray: 4, 4;
            animation: dash 0.8s linear infinite;
            animation-play-state: paused;
        }
        .wire-active {
            animation-play-state: running;
            stroke-width: 2.5;
        }
        @keyframes dash {
            to {
                stroke-dashoffset: -8;
            }
        }
    </style>

    <!-- Vue 3 runtime (global build) — needs to load before our module -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col w-full overflow-x-hidden">

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!--  TEMPLATE: Root component (app.js)                                -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <template id="root-tpl">
        <div>
            <!-- Header -->
            <header class="bg-gray-800 border-b border-gray-700 py-3 px-6 shadow-md w-full">
                <div class="w-full flex flex-col md:flex-row justify-between items-center gap-3">
                    <div>
                        <h1 class="text-xl font-bold text-amber-500">Präziser Verdrahtungsplan: Honigschleuder</h1>
                        <p class="text-xs text-gray-400">Kreuzungsfreie Leitungsführung · State Machine: 6 Zustände · Config: honey_config.js (simSpeed 0.2×)</p>
                    </div>
                    <div class="flex gap-2 flex-wrap">
                        <span class="bg-purple-900/50 border border-purple-500 text-purple-400 text-xs px-2.5 py-1 rounded-full font-semibold">
                            + Folientaster integriert
                        </span>
                        <span class="bg-blue-900/50 border border-blue-500 text-blue-400 text-xs px-2.5 py-1 rounded-full font-semibold">
                            3-Wire-Sicherheitslogik
                        </span>
                        <span class="bg-green-900/50 border border-green-500 text-green-400 text-xs px-2.5 py-1 rounded-full font-semibold">
                            ↺ Richtungswechsel im Betrieb
                        </span>
                    </div>
                </div>
            </header>

            <!-- Main Grid: 1/4 zu 3/4 Aufteilung -->
            <main class="flex-grow w-full p-4 grid grid-cols-1 xl:grid-cols-4 gap-6">

                <!-- Left Column (Interactive Controls) -->
                <div class="xl:col-span-1 flex flex-col gap-5 h-fit">
                    <control-panel
                        :ui-locked="uiLocked"
                        @dir-left="onDirLeft"
                        @dir-right="onDirRight"
                        @stop="onStop"
                        @start="onStart"
                        @preset1="onPreset1"
                        @preset2="onPreset2"
                        @toggle-lock="onToggleLock"></control-panel>

                    <status-display
                        :state-id="simState.id"
                        :color-box="simState.colorBox"
                        :color-ping="simState.colorPing"
                        :color-dot="simState.colorDot"
                        :color-bar="simState.colorBar"
                        :show-ping="simState.showPing"
                        :status-text="simState.statusText"
                        :status-desc="simState.statusDesc"
                        :is-ramping="simState.isRamping"
                        :progress="simState.progress"
                        :ramp-label="simState.rampLabel"></status-display>

                    <state-machine-legend :state-id="simState.id"></state-machine-legend>
                </div>

                <!-- Right Column: Schematic -->
                <schematic-canvas
                    :sim-state="simState"
                    :ui-locked="uiLocked"
                    @toggle-lock="onToggleLock"></schematic-canvas>

            </main>

            <!-- Pin Out table -->
            <section class="w-full px-4 pb-8">
                <wiring-table></wiring-table>
            </section>
        </div>
    </template>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!--  TEMPLATE: StatusDisplay                                          -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <template id="status-display-tpl">
        <div class="bg-gray-950 p-3.5 rounded-lg border border-gray-800">
            <!-- Section label -->
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-1.5">Motor-Zustand</span>

            <!-- State indicator row -->
            <div :class="['flex items-center gap-2', colorBox]">
                <span class="relative flex h-2.5 w-2.5">
                    <span v-if="showPing" :class="['animate-ping absolute inline-flex h-full w-full rounded-full', colorPing]" style="opacity:0.75"></span>
                    <span :class="['relative inline-flex rounded-full h-2.5 w-2.5', colorDot]"></span>
                </span>
                <span class="text-xs font-bold">{{ statusText }}</span>
            </div>

            <!-- Description -->
            <p class="text-[11px] text-gray-400 mt-1.5">{{ statusDesc }}</p>

            <!-- Ramp progress bar (conditional) -->
            <div v-if="isRamping" class="mt-2">
                <div class="flex justify-between text-[10px] mb-1">
                    <span class="text-gray-400">{{ rampLabel }}</span>
                    <span class="text-gray-400">{{ pct }}%</span>
                </div>
                <div class="w-full bg-gray-700 rounded-full h-1.5">
                    <div :class="['h-1.5 rounded-full', colorBar]" :style="{ width: pct + '%' }"></div>
                </div>
                <span class="text-[9px] text-gray-600 mt-0.5 block">Simulation: simSpeed 0.2× · Reales Board: 1.0× (15 s)</span>
            </div>
        </div>
    </template>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!--  TEMPLATE: ControlPanel                                           -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <template id="control-panel-tpl">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 shadow-lg flex flex-col gap-5 h-fit">
            <!-- Section header -->
            <div>
                <h2 class="text-md font-bold text-gray-200 border-b border-gray-700 pb-2 mb-3">Interaktive Simulation</h2>
                <p class="text-xs text-gray-400 mb-3">Simulation (HoneyConfig.simSpeed = 0.2 → 3 s statt 15 s). Tasten verhalten sich zustandsabhängig:</p>

                <div class="space-y-3">
                    <!-- Folientaster 1: Richtung -->
                    <div class="bg-gray-950 p-3 rounded-lg border border-gray-800">
                        <span class="text-xs font-bold text-purple-400 uppercase tracking-wider block mb-1">Folientaster 1: Richtung</span>
                        <p class="text-[10px] text-gray-500 mb-1.5">Standby: vorwählen · Im Betrieb: Wechsel+Neustart</p>
                        <div class="grid grid-cols-2 gap-2">
                            <button @click="$emit('dir-left')"
                                class="bg-gray-800 hover:bg-purple-900/40 border border-gray-700 py-1.5 rounded text-xs font-semibold transition">
                                ◀ Links (CCW)</button>
                            <button @click="$emit('dir-right')"
                                class="bg-gray-800 hover:bg-purple-900/40 border border-gray-700 py-1.5 rounded text-xs font-semibold transition">
                                Rechts (CW) ▶</button>
                        </div>
                    </div>

                    <!-- Folientaster 2: Steuerung -->
                    <div class="bg-gray-950 p-3 rounded-lg border border-gray-800">
                        <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider block mb-1.5">Folientaster 2: Steuerung</span>
                        <div class="grid grid-cols-4 gap-1">
                            <button @click="$emit('stop')"
                                class="bg-red-950 hover:bg-red-900/50 border border-red-800 py-2 rounded text-[10px] font-bold text-red-200">
                                ROT<br>(Stop)</button>
                            <button @click="$emit('preset1')"
                                class="bg-amber-950 hover:bg-amber-900/50 border border-amber-800 py-2 rounded text-[10px] font-bold text-amber-200">
                                GELB 1<br>(P1)</button>
                            <button @click="$emit('preset2')"
                                class="bg-amber-950 hover:bg-amber-900/50 border border-amber-800 py-2 rounded text-[10px] font-bold text-amber-200">
                                GELB 2<br>(P2)</button>
                            <button @click="$emit('start')"
                                class="bg-emerald-950 hover:bg-emerald-900/50 border border-emerald-800 py-2 rounded text-[10px] font-bold text-emerald-200">
                                GRÜN<br>(Start)</button>
                        </div>
                    </div>

                    <!-- Hardware Wippschalter -->
                    <div class="bg-gray-900 p-3 rounded-lg border border-gray-800">
                        <div class="flex justify-between items-center gap-2">
                            <div>
                                <span class="text-xs font-semibold block text-gray-200">Wippschalter (X2)</span>
                                <span class="text-[10px] text-gray-500">Hardware Betriebs-Sperre</span>
                            </div>
                            <button @click="$emit('toggle-lock')"
                                :class="['px-3 py-1.5 rounded-lg text-xs font-medium transition',
                                    uiLocked ? 'bg-red-600 text-white hover:bg-red-500' : 'bg-green-600 text-white hover:bg-green-500']">
                                {{ uiLocked ? 'SPERRE (OFF)' : 'FREIGABE (ON)' }}</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!--  TEMPLATE: SchematicCanvas (SVG wiring diagram)                   -->
    <!-- ══════════════════════════════════════════════════════════════════ -->

                <h2 class="text-md font-bold text-gray-200">Elektrischer Verdrahtungsplan</h2>

                    Komplett kreuzungsfreie und außenliegende Leitungsführung
                </span>
            </div>

                        <path d="M 50,0 L 50,820 M 100,0 L 100,820 M 150,0 L 150,820 M 200,0 L 200,820 M 250,0 L 250,820 M 300,0 L 300,820 M 350,0 L 350,820 M 400,0 L 400,820 M 450,0 L 450,820 M 500,0 L 500,820 M 550,0 L 550,820 M 600,0 L 600,820 M 650,0 L 650,820 M 700,0 L 700,820 M 750,0 L 750,820 M 800,0 L 800,820 M 850,0 L 850,820 M 900,0 L 900,820 M 950,0 L 950,820 M 1000,0 L 1000,820 M 1050,0 L 1050,820 M 1100,0 L 1100,820 M 1150,0 L 1150,820" stroke="#FFF" stroke-width="1"></path>
                    </g>

                    <!-- ====== ARDUINO UNO R4 WIFI ====== -->
                    <g transform="translate(30, 40)">
                        <rect width="210" height="340" rx="10" fill="#1E293B" fill-opacity="0.35" stroke="#0EA5E9" stroke-width="2.5"></rect>
                        <text x="105" y="25" fill="#0EA5E9" font-weight="bold" font-size="12" text-anchor="middle">ARDUINO UNO R4 WIFI</text>
                        <!-- Left Power Rail -->
                        <g transform="translate(0, 50)">
                            <rect x="0" y="0" width="10" height="12" fill="#EF4444"></rect>
                            <circle id="pin-ard-5v" cx="5" cy="6" r="3.5" fill="#EF4444" stroke="#FFF" stroke-width="0.75"></circle>
                            <text x="18" y="10" fill="#FFF" font-size="9" text-anchor="start">5V OUT</text>
                            <rect x="0" y="30" width="10" height="12" fill="#4B5563"></rect>
                            <circle id="pin-ard-gnd" cx="5" cy="36" r="3.5" fill="#4B5563" stroke="#FFF" stroke-width="0.75"></circle>
                            <text x="18" y="40" fill="#FFF" font-size="9" text-anchor="start">GND</text>
                        </g>
                        <!-- Right Digital IO Pins -->
                        <g transform="translate(200, 50)">
                            <rect x="0" y="10" width="10" height="12" fill="#F59E0B"></rect><circle id="pin-ard-d2" cx="5" cy="16" r="3.5" fill="#F59E0B" stroke="#FFF" stroke-width="0.75"></circle><text x="-12" y="20" fill="#FFF" font-size="9" text-anchor="end">D2 (Rel 1 / X1)</text>
                            <rect x="0" y="35" width="10" height="12" fill="#3B82F6"></rect><circle id="pin-ard-d3" cx="5" cy="41" r="3.5" fill="#3B82F6" stroke="#FFF" stroke-width="0.75"></circle><text x="-12" y="45" fill="#FFF" font-size="9" text-anchor="end">D3 (Rel 2 / X3)</text>
                            <rect x="0" y="70" width="10" height="12" fill="#A855F7"></rect><circle id="pin-ard-d4" cx="5" cy="76" r="3.5" fill="#A855F7" stroke="#FFF" stroke-width="0.75"></circle><text x="-12" y="80" fill="#FFF" font-size="9" text-anchor="end">D6 (Rot / Links / 3)</text>
                            <rect x="0" y="95" width="10" height="12" fill="#A855F7"></rect><circle id="pin-ard-d5" cx="5" cy="101" r="3.5" fill="#A855F7" stroke="#FFF" stroke-width="0.75"></circle><text x="-12" y="105" fill="#FFF" font-size="9" text-anchor="end">D7 (Gelb / Rechts / 2)</text>
                            <rect x="0" y="130" width="10" height="12" fill="#EF4444"></rect><circle id="pin-ard-d6" cx="5" cy="136" r="3.5" fill="#EF4444" stroke="#FFF" stroke-width="0.75"></circle><text x="-12" y="140" fill="#FFF" font-size="9" text-anchor="end">D8 (Key Rot-Stop)</text>
                            <rect x="0" y="155" width="10" height="12" fill="#F59E0B"></rect><circle id="pin-ard-d7" cx="5" cy="161" r="3.5" fill="#F59E0B" stroke="#FFF" stroke-width="0.75"></circle><text x="-12" y="165" fill="#FFF" font-size="9" text-anchor="end">D9 (Key Gelb 1)</text>
                            <rect x="0" y="180" width="10" height="12" fill="#F59E0B"></rect><circle id="pin-ard-d8" cx="5" cy="186" r="3.5" fill="#F59E0B" stroke="#FFF" stroke-width="0.75"></circle><text x="-12" y="190" fill="#FFF" font-size="9" text-anchor="end">D10 (Key Gelb 2)</text>
                            <rect x="0" y="205" width="10" height="12" fill="#10B981"></rect><circle id="pin-ard-d9" cx="5" cy="211" r="3.5" fill="#10B981" stroke="#FFF" stroke-width="0.75"></circle><text x="-12" y="215" fill="#FFF" font-size="9" text-anchor="end">11 (Key Grn-Start)</text>
                            <rect x="0" y="240" width="10" height="12" fill="#F59E0B"></rect><circle id="pin-ard-r3" cx="5" cy="246" r="3.5" fill="#F59E0B" stroke="#FFF" stroke-width="0.75"></circle><text x="-12" y="250" fill="#FFF" font-size="9" text-anchor="end">D4 (Rel M1 / Speed 0)</text>
                            <rect x="0" y="265" width="10" height="12" fill="#F59E0B"></rect><circle id="pin-ard-r4" cx="5" cy="271" r="3.5" fill="#F59E0B" stroke="#FFF" stroke-width="0.75"></circle><text x="-12" y="275" fill="#FFF" font-size="9" text-anchor="end">D5 (Rel M2 / Speed 1)</text>
                        </g>
                    </g>

                    <!-- ====== 4-KANAL RELAIS-BANK ====== -->
                    <g transform="translate(470, 40)">
                        <rect width="260" height="370" rx="8" fill="#1E293B" fill-opacity="0.35" stroke="#F97316" stroke-width="2.5"></rect>
                        <text x="130" y="22" fill="#F97316" font-weight="bold" font-size="11" text-anchor="middle">4-KANAL RELAIS-BANK</text>
                        <!-- Power pins (whole bank) -->
                        <g transform="translate(5, 45)">
                            <circle id="pin-rbank-vcc" cx="5" cy="5" r="4.5" fill="#EF4444" stroke="#FFF" stroke-width="0.75"></circle>
                            <text x="18" y="8" fill="#EF4444" font-size="9" font-weight="bold">DC+</text>
                            <circle id="pin-rbank-gnd" cx="5" cy="28" r="4.5" fill="#4B5563" stroke="#FFF" stroke-width="0.75"></circle>
                            <text x="18" y="31" fill="#4B5563" font-size="9" font-weight="bold">DC-</text>
                        </g>

                        <!-- Kanal 1: START/STOP (X1) — Orange -->
                        <g transform="translate(0, 78)">
                            <rect x="15" y="5" width="40" height="20" rx="3" fill="#111827"></rect>
                            <rect x="29" y="8" width="12" height="14" fill="#EF4444" rx="1"></rect>
                            <text x="35" y="18" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">H</text>
                            <text x="70" y="18" fill="#F59E0B" font-size="9" font-weight="bold">K1: START/STOP (X1)</text>
                            <circle id="pin-r1-in" cx="10" cy="50" r="4.5" fill="#F59E0B" stroke="#FFF" stroke-width="0.75"></circle>
                            <text x="23" y="53" fill="#F59E0B" font-size="9" font-weight="bold">IN (D2)</text>
                            <!-- NO/COM/NC terminal block -->
                            <g transform="translate(185, 0)">
                                <rect width="60" height="68" rx="4" fill="#0284C7"></rect>
                                <circle id="pin-r1-no" cx="30" cy="14" r="5" fill="#EF4444" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="18" fill="#FFF" font-size="8" text-anchor="end">NO</text>
                                <circle id="pin-r1-com" cx="30" cy="36" r="5" fill="#F97316" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="40" fill="#FFF" font-size="8" text-anchor="end">COM</text>
                                <circle cx="30" cy="58" r="5" fill="#6B7280" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="62" fill="#FFF" font-size="8" text-anchor="end">NC</text>
                            </g>
                        </g>

                        <!-- Kanal 2: CW/CCW (X3) — Blau -->
                        <g transform="translate(0, 158)">
                            <rect x="15" y="5" width="40" height="20" rx="3" fill="#111827"></rect>
                            <rect x="29" y="8" width="12" height="14" fill="#EF4444" rx="1"></rect>
                            <text x="35" y="18" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">H</text>
                            <text x="70" y="18" fill="#3B82F6" font-size="9" font-weight="bold">K2: CW/CCW (X3)</text>
                            <circle id="pin-r2-in" cx="10" cy="50" r="4.5" fill="#3B82F6" stroke="#FFF" stroke-width="0.75"></circle>
                            <text x="23" y="53" fill="#3B82F6" font-size="9" font-weight="bold">IN (D3)</text>
                            <g transform="translate(185, 0)">
                                <rect width="60" height="68" rx="4" fill="#0284C7"></rect>
                                <circle id="pin-r2-no" cx="30" cy="14" r="5" fill="#3B82F6" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="18" fill="#FFF" font-size="8" text-anchor="end">NO</text>
                                <circle id="pin-r2-com" cx="30" cy="36" r="5" fill="#F97316" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="40" fill="#FFF" font-size="8" text-anchor="end">COM</text>
                                <circle cx="30" cy="58" r="5" fill="#6B7280" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="62" fill="#FFF" font-size="8" text-anchor="end">NC</text>
                            </g>
                        </g>

                        <!-- Kanal 3: M1 (Speed Bit 0) — Amber -->
                        <g transform="translate(0, 238)">
                            <rect x="15" y="5" width="40" height="20" rx="3" fill="#111827"></rect>
                            <rect x="29" y="8" width="12" height="14" fill="#EF4444" rx="1"></rect>
                            <text x="35" y="18" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">H</text>
                            <text x="70" y="18" fill="#F59E0B" font-size="9" font-weight="bold">K3: M1 (Speed Bit 0)</text>

                            <g transform="translate(185, 0)">
                                <rect width="60" height="68" rx="4" fill="#0284C7"></rect>
                                <circle id="pin-r3-no" cx="30" cy="14" r="5" fill="#F59E0B" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="18" fill="#FFF" font-size="8" text-anchor="end">NO</text>
                                <circle id="pin-r3-com" cx="30" cy="36" r="5" fill="#F97316" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="40" fill="#FFF" font-size="8" text-anchor="end">COM</text>
                                <circle cx="30" cy="58" r="5" fill="#6B7280" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="62" fill="#FFF" font-size="8" text-anchor="end">NC</text>
                            </g>
                        </g>

                        <!-- Kanal 4: M2 (Speed Bit 1) — Amber -->
                        <g transform="translate(0, 318)">
                            <rect x="15" y="5" width="40" height="20" rx="3" fill="#111827"></rect>
                            <rect x="29" y="8" width="12" height="14" fill="#EF4444" rx="1"></rect>
                            <text x="35" y="18" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">H</text>
                            <text x="70" y="18" fill="#F59E0B" font-size="9" font-weight="bold">K4: M2 (Speed Bit 1)</text>
                            <circle id="pin-r4-in" cx="10" cy="50" r="4.5" fill="#F59E0B" stroke="#FFF" stroke-width="0.75"></circle>
                            <text x="23" y="53" fill="#F59E0B" font-size="9" font-weight="bold">IN (D5)</text>
                            <g transform="translate(185, 0)">
                                <rect width="60" height="68" rx="4" fill="#0284C7"></rect>
                                <circle id="pin-r4-no" cx="30" cy="14" r="5" fill="#F59E0B" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="18" fill="#FFF" font-size="8" text-anchor="end">NO</text>
                                <circle id="pin-r4-com" cx="30" cy="36" r="5" fill="#F97316" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="40" fill="#FFF" font-size="8" text-anchor="end">COM</text>
                                <circle cx="30" cy="58" r="5" fill="#6B7280" stroke="#FFF" stroke-width="1"></circle>
                                <text x="15" y="62" fill="#FFF" font-size="8" text-anchor="end">NC</text>
                            </g>
                        </g>
                    </g>

                    <!-- ====== FOLIENTASTER 1: RICHTUNG (3 PIN) ====== -->
                    <g transform="translate(30, 400)">
                        <rect width="180" height="110" rx="6" fill="#111827" fill-opacity="0.35" stroke="#A855F7" stroke-width="2"></rect>
                        <text x="90" y="20" fill="#A855F7" font-weight="bold" font-size="10" text-anchor="middle">FOLIEN-RICHTUNGSTASTER</text>
                        <circle cx="45" cy="50" r="14" fill="#3B82F6" stroke="#93C5FD" stroke-width="1.2"></circle><text x="45" y="53" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">◀</text>
                        <circle cx="135" cy="50" r="14" fill="#3B82F6" stroke="#93C5FD" stroke-width="1.2"></circle><text x="135" y="53" fill="#FFF" font-weight="bold" font-size="9" text-anchor="middle">▶</text>
                        <g transform="translate(45, 95)">
                            <circle id="pin-f1-gnd" cx="0" cy="0" r="4.5" fill="#4B5563" stroke="#FFF" stroke-width="0.75"></circle><text x="0" y="-10" fill="#9CA3AF" font-size="8" text-anchor="middle">GND</text>
                            <circle id="pin-f1-links" cx="45" cy="0" r="4.5" fill="#A855F7" stroke="#FFF" stroke-width="0.75"></circle><text x="45" y="-10" fill="#A855F7" font-size="8" text-anchor="middle">LINKS</text>
                            <circle id="pin-f1-rechts" cx="90" cy="0" r="4.5" fill="#A855F7" stroke="#FFF" stroke-width="0.75"></circle><text x="90" y="-10" fill="#A855F7" font-size="8" text-anchor="middle">RECHTS</text>
                        </g>
                    </g>

                    <!-- ====== FOLIENTASTER 2: STEUERUNG (5 PIN) ====== -->
                    <g transform="translate(30, 560)">
                        <rect width="210" height="120" rx="6" fill="#111827" fill-opacity="0.35" stroke="#10B981" stroke-width="2"></rect>
                        <text x="105" y="20" fill="#10B981" font-weight="bold" font-size="10" text-anchor="middle">FOLIEN-PROG-TASTER (5 PIN)</text>
                        <circle cx="35" cy="52" r="11" fill="#EF4444"></circle><text x="35" y="55" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">ROT</text>
                        <circle cx="80" cy="52" r="11" fill="#F59E0B"></circle><text x="80" y="55" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">Y1</text>
                        <circle cx="125" cy="52" r="11" fill="#F59E0B"></circle><text x="125" y="55" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">Y2</text>
                        <circle cx="170" cy="52" r="11" fill="#10B981"></circle><text x="170" y="55" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">GRN</text>
                        <g transform="translate(25, 105)">
                            <circle id="pin-f2-gnd" cx="0" cy="0" r="4.5" fill="#4B5563" stroke="#FFF" stroke-width="0.75"></circle><text x="0" y="-10" fill="#9CA3AF" font-size="8" text-anchor="middle">GND</text>
                            <circle id="pin-f2-rot" cx="40" cy="0" r="4.5" fill="#EF4444" stroke="#FFF" stroke-width="0.75"></circle><text x="40" y="-10" fill="#EF4444" font-size="8" text-anchor="middle">R</text>
                            <circle id="pin-f2-yel1" cx="80" cy="0" r="4.5" fill="#F59E0B" stroke="#FFF" stroke-width="0.75"></circle><text x="80" y="-10" fill="#F59E0B" font-size="8" text-anchor="middle">Y1</text>
                            <circle id="pin-f2-yel2" cx="120" cy="0" r="4.5" fill="#F59E0B" stroke="#FFF" stroke-width="0.75"></circle><text x="120" y="-10" fill="#F59E0B" font-size="8" text-anchor="middle">Y2</text>
                            <circle id="pin-f2-grn" cx="160" cy="0" r="4.5" fill="#10B981" stroke="#FFF" stroke-width="0.75"></circle><text x="160" y="-10" fill="#10B981" font-size="8" text-anchor="middle">G</text>
                        </g>
                    </g>

                    <!-- ====== WAGO KLEMME (C0 BUS) ====== -->
                    <g transform="translate(470, 420)">
                        <rect width="260" height="100" rx="6" fill="#F97316" fill-opacity="0.35" stroke="#C2410C" stroke-width="2"></rect>
                        <text x="130" y="24" fill="#FFF" font-weight="bold" font-size="11" text-anchor="middle">C0-BUS (WAGO 7-fach)</text>
                        <g transform="translate(15, 52)">
                            <circle id="wago-contact-1" cx="20" cy="15" r="7" fill="#4B5563" stroke="#FFF" stroke-width="1.2"></circle>
                            <circle id="wago-contact-2" cx="55" cy="15" r="7" fill="#4B5563" stroke="#FFF" stroke-width="1.2"></circle>
                            <circle id="wago-contact-3" cx="90" cy="15" r="7" fill="#4B5563" stroke="#FFF" stroke-width="1.2"></circle>
                            <circle id="wago-contact-4" cx="125" cy="15" r="7" fill="#4B5563" stroke="#FFF" stroke-width="1.2"></circle>
                            <circle id="wago-contact-5" cx="160" cy="15" r="7" fill="#4B5563" stroke="#FFF" stroke-width="1.2"></circle>
                            <circle id="wago-contact-6" cx="195" cy="15" r="7" fill="#4B5563" stroke="#FFF" stroke-width="1.2"></circle>
                            <circle id="wago-contact-7" cx="230" cy="15" r="7" fill="#4B5563" stroke="#FFF" stroke-width="1.2"></circle>
                        </g>
                    </g>

                    <!-- ====== MANUAL SWITCH (WIPPSCHALTER X2) -- REACTIVE ====== -->
                    <g id="switch-graphic" class="cursor-pointer" @click="$emit('toggle-lock')" transform="translate(860, 540)">
                        <rect width="240" height="80" rx="6" fill="#111827" fill-opacity="0.35" stroke="#9CA3AF" stroke-width="2"></rect>
                        <text x="120" y="22" fill="#9CA3AF" font-weight="bold" font-size="11" text-anchor="middle">MANUELLER WIPPSCHALTER (X2)</text>
                        <circle id="switch-contact-1" cx="50" cy="50" r="8" fill="#374151" stroke="#FFF"></circle>
                        <circle id="switch-contact-2" cx="190" cy="50" r="8" fill="#374151" stroke="#FFF"></circle>
                        <line id="switch-lever" x1="50" y1="50" :y2="switchLeverY2" x2="190" :stroke="switchLeverColor" stroke-width="3"></line>
                        <text id="switch-text-val" x="120" y="55" :fill="switchTextColor" font-weight="bold" font-size="12" text-anchor="middle">{{ switchText }}</text>
                    </g>

                    <!-- ====== ORIENTAL MOTOR DRIVER ====== -->
                    <g transform="translate(860, 40)">
                        <rect width="300" height="490" rx="8" fill="#1E293B" fill-opacity="0.35" stroke="#10B981" stroke-width="3"></rect>
                        <text x="150" y="25" fill="#10B981" font-weight="bold" font-size="13" text-anchor="middle">ORIENTAL MOTOR BLF</text>
                        <text x="150" y="42" fill="#86EFAC" font-size="10" text-anchor="middle">Steuerungsklemmen (Control I/O)</text>
                        <g transform="translate(30, 75)" fill="#374151">
                            <rect x="0" y="0" width="60" height="35" rx="3" stroke="#4B5563"></rect><circle id="pin-driver-x1" cx="15" cy="17.5" r="5" fill="#10B981" stroke="#FFF" stroke-width="1"></circle><text x="35" y="22" fill="#FFF" font-weight="bold" font-size="12">X1</text><text x="75" y="22" fill="#9CA3AF" font-size="10">START/STOP</text>
                            <rect x="0" y="55" width="60" height="35" rx="3" stroke="#4B5563"></rect><circle id="pin-driver-x2" cx="15" cy="72.5" r="5" fill="#10B981" stroke="#FFF" stroke-width="1"></circle><text x="35" y="77" fill="#FFF" font-weight="bold" font-size="12">X2</text><text x="75" y="77" fill="#9CA3AF" font-size="10">RUN/BRAKE</text>
                            <rect x="0" y="110" width="60" height="35" rx="3" stroke="#4B5563"></rect><circle id="pin-driver-x3" cx="15" cy="127.5" r="5" fill="#10B981" stroke="#FFF" stroke-width="1"></circle><text x="35" y="132" fill="#FFF" font-weight="bold" font-size="12">X3</text><text x="75" y="132" fill="#9CA3AF" font-size="10">CW/CCW</text>
                            <rect x="0" y="165" width="85" height="35" rx="3" stroke="#4B5563"></rect><circle id="pin-driver-incom" cx="15" cy="182.5" r="5" fill="#10B981" stroke="#FFF" stroke-width="1"></circle><text x="32" y="187" fill="#FFF" font-weight="bold" font-size="11">IN-COM</text><text x="95" y="187" fill="#9CA3AF" font-size="10">MASSE</text>
                            <rect x="0" y="220" width="85" height="35" rx="3" stroke="#4B5563"></rect><circle id="pin-driver-x0" cx="15" cy="237.5" r="5" fill="#10B981" stroke="#FFF" stroke-width="1"></circle><text x="32" y="242" fill="#FFF" font-weight="bold" font-size="11">X0</text><text x="95" y="242" fill="#9CA3AF" font-size="10">Error Port</text>
                            <rect x="0" y="275" width="85" height="35" rx="3" stroke="#4B5563"></rect><circle id="pin-driver-m1" cx="15" cy="292.5" r="5" fill="#F59E0B" stroke="#FFF" stroke-width="1"></circle><text x="32" y="297" fill="#FFF" font-weight="bold" font-size="11">M1</text><text x="95" y="297" fill="#9CA3AF" font-size="10">Speed Bit 0 (D4)</text>
                            <rect x="0" y="330" width="85" height="35" rx="3" stroke="#4B5563"></rect><circle id="pin-driver-m2" cx="15" cy="347.5" r="5" fill="#F59E0B" stroke="#FFF" stroke-width="1"></circle><text x="32" y="352" fill="#FFF" font-weight="bold" font-size="11">M2</text><text x="95" y="352" fill="#9CA3AF" font-size="10">Speed Bit 1 (D5)</text>
                            <rect x="0" y="385" width="85" height="35" rx="3" stroke="#4B5563"></rect><circle id="pin-driver-m0" cx="15" cy="402.5" r="5" fill="#4B5563" stroke="#FFF" stroke-width="1"></circle><text x="32" y="407" fill="#FFF" font-weight="bold" font-size="11">M0</text><text x="95" y="407" fill="#9CA3AF" font-size="10">GND (Hardwire)</text>
                        </g>
                    </g>

                    <!-- ====== WIRES (DATA-DRIVEN) ====== -->
                    <g v-for="w in wireDefs" :key="w.id">
                        <path :id="w.id" :d="w.path" fill="none"
                            :class="['wire', { 'wire-active': wireStates[w.id].active }]"
                            :stroke="wireStates[w.id].color"
                            :stroke-width="w.strokeWidth"></path>
                    </g>

                    <!-- Junction dots -->
                    <circle v-for="j in junctions" :key="j.cx + ',' + j.cy" :cx="j.cx" :cy="j.cy" :r="j.r" :fill="j.fill"></circle>

                </svg>
            </div>

            <!-- Notes Section -->
            <div class="mt-4 bg-gray-900/50 p-3 rounded-lg border border-gray-700 text-[11px] space-y-1.5 text-gray-300">
                <p><strong class="text-amber-500">Anlauf- &amp; Bremsrampen:</strong> Rampenzeiten werden aus den dAtA-Profilen (honey_config.js → speed_dataset.cpp) berechnet. Die Rampendauer skaliert proportional zur Zieldrehzahl (targetRpm / 3000). simSpeed = 0.2 für Demo, 1.0 für Echtzeit-Verifikation.</p>
                <p><strong class="text-green-400">↺ Richtungswechsel im Betrieb:</strong> LINKS im Zustand LÄUFT-CW / ANLAUFEN-CW bzw. RECHTS im Zustand LÄUFT-CCW / ANLAUFEN-CCW lösen automatisch aus: proportionale Bremsrampe → Sicherheitspause (1,5 s) → neues Richtungsrelais (REL2/X3) → Anlauframpe (15 s).</p>
                <p><strong class="text-amber-500">Info (Folientaster):</strong> Pins D6–D11 als INPUT_PULLUP – aktiv LOW, keine externen Widerstände nötig. D4/D5 steuern die M1/M2 Speed-Relais.</p>
                <p><strong class="text-amber-500">Geometrische Entflechtung:</strong> Die Leitungen der Folientaster wurden komplett nach unten aus den Gehäusen herausgeleitet. Spannungsversorgungen fließen über die Oberseite des Controllers hinweg. Keine Überschneidungen mit Beschriftungen oder aktiven Bauteilen!</p>
            </div>
        </div>
    </template>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!--  TEMPLATE: StateMachineLegend                                     -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <template id="state-machine-legend-tpl">
        <div class="bg-gray-950 rounded-lg border border-gray-800 p-3">
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-wider block mb-2">Zustandsmaschine</span>
            <div class="space-y-1 text-[10px]">
                <div v-for="s in states" :key="s.id" class="flex items-center gap-1.5"
                    :class="{ 'opacity-100': isActive(s.id), 'opacity-70': !isActive(s.id) }">
                    <span :class="['w-2 h-2 rounded-full flex-shrink-0', s.color,
                        { 'ring-1 ring-white ring-offset-1 ring-offset-gray-950': isActive(s.id) }]"></span>
                    <span :class="isActive(s.id) ? 'text-white' : 'text-gray-400'">
                        <b :class="isActive(s.id) ? 'text-white' : 'text-gray-300'">{{ s.label }}</b> – {{ s.desc }}
                    </span>
                </div>
            </div>
        </div>
    </template>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!--  TEMPLATE: WiringTable                                            -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <template id="wiring-table-tpl">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-4 shadow-lg">
            <h2 class="text-sm font-bold text-gray-200 border-b border-gray-700 pb-2 mb-3">Verkabelungsliste mit den neuen Keypads</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-gray-300">
                    <thead class="bg-gray-900 uppercase text-gray-400">
                        <tr>
                            <th class="p-2">Quelle (Arduino / Bauteil)</th>
                            <th class="p-2">Schnittstelle (Pin)</th>
                            <th class="p-2">Zielort</th>
                            <th class="p-2">Zweck / Logik</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-700">
                        <tr v-for="(row, i) in rows" :key="i" :class="{ 'bg-gray-900/30': row.muted }">
                            <td class="p-2 font-semibold" :class="row.color">{{ row.quelle }}</td>
                            <td class="p-2">{{ row.pin }}</td>
                            <td class="p-2" v-html="row.ziel"></td>
                            <td class="p-2" v-html="row.zweck"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </template>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!--  Vue Mount Point                                                   -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <div id="app"></div>

    <!-- ══════════════════════════════════════════════════════════════════ -->
    <!--  Single ES module entry point (replaces 11 script tags)            -->
    <!-- ══════════════════════════════════════════════════════════════════ -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
