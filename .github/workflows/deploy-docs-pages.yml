name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "basic-control/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate snapshot artifacts
        run: npm run snapshot

      - name: Prepare static site root
        run: |
          mkdir -p _site
          cp -R basic-control/docs _site/docs
          cp -R basic-control/VisualizeStateTransitions _site/VisualizeStateTransitions

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
